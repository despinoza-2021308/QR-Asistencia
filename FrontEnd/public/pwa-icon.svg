<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1626" />
      <stop offset="50%" stop-color="#060a12" />
      <stop offset="100%" stop-color="#04101e" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fondo base con esquinas redondeadas estilo App Icon -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#brandGrad)" stroke-width="4" stroke-opacity="0.3" />

  <!-- Efecto Glow Central -->
  <circle cx="256" cy="256" r="140" fill="#14b8a6" opacity="0.12" filter="url(#glow)" />

  <!-- Símbolo QR y Tecnológico -->
  <g fill="url(#brandGrad)">
    <!-- Esquina Superior Izquierda (Finder Pattern) -->
    <rect x="96" y="96" width="112" height="112" rx="28" fill="none" stroke="url(#brandGrad)" stroke-width="20" />
    <rect x="132" y="132" width="40" height="40" rx="10" fill="url(#brandGrad)" />

    <!-- Esquina Superior Derecha (Finder Pattern) -->
    <rect x="304" y="96" width="112" height="112" rx="28" fill="none" stroke="url(#brandGrad)" stroke-width="20" />
    <rect x="340" y="132" width="40" height="40" rx="10" fill="url(#brandGrad)" />

    <!-- Esquina Inferior Izquierda (Finder Pattern) -->
    <rect x="96" y="304" width="112" height="112" rx="28" fill="none" stroke="url(#brandGrad)" stroke-width="20" />
    <rect x="132" y="340" width="40" height="40" rx="10" fill="url(#brandGrad)" />

    <!-- Datos / Bloques centrales del QR -->
    <rect x="236" y="96" width="40" height="40" rx="10" />
    <rect x="236" y="172" width="40" height="40" rx="10" />
    <rect x="96" y="240" width="40" height="40" rx="10" />
    <rect x="172" y="240" width="40" height="40" rx="10" />
    
    <!-- Centro - Nodo de Conexión -->
    <rect x="236" y="236" width="40" height="40" rx="12" fill="#38bdf8" />
    
    <rect x="304" y="240" width="40" height="40" rx="10" />
    <rect x="376" y="240" width="40" height="40" rx="10" />
    <rect x="236" y="304" width="40" height="40" rx="10" />
    <rect x="304" y="304" width="40" height="40" rx="10" />
    <rect x="376" y="320" width="40" height="96" rx="14" fill="url(#blueGrad)" />
    <rect x="236" y="376" width="108" height="40" rx="12" />
  </g>

  <!-- Texto / Branding ONE sutil -->
  <text x="256" y="472" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#94a3b8" text-anchor="middle" letter-spacing="4">ONE CONSULTING</text>
</svg>
